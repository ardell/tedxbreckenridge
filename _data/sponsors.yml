- name: Arapahoe Basin
  url: https://www.arapahoebasin.com/
  # Their horizontal lockup: the mark in a navy plate beside the
  # "ARAPAHOE BASIN / COLORADO" wordmark reversed out of a red one. Built as a
  # vector from two sources — the mark is their own artwork (the official
  # abasinlogo.svg), and the lettering is traced from the marketing lockup,
  # since neither their site nor any distributor publishes a horizontal vector.
  # Proportions, colours (PMS-ish navy #002F65 / red #B43538) and the optical
  # placement of the mark and type were measured off that reference.
  #
  # Both halves knock their content out of a filled plate, so the artwork
  # carries the full navy/red/white rather than sitting on transparency. That
  # needs the `rev` tone: `dk` would flatten the plates to one black rectangle
  # and swallow the mark, and `inv` would recolour them.
  #
  # At 3.19:1 the lockup is wide rather than tall, so it wants a shorter strip
  # than the stacked mark did — 44px here is ~140px wide, in family with the
  # other wall logos — and a max_width that lets it run to its natural width.
  logo: /assets/images/sponsors/arapahoe-basin-horizontal.svg
  note: Summit County
  tone: rev
  # On the program's dark plate rev would invert the filled navy/red plates into
  # a photo negative, so it desaturates only (program_tone: gray) — the filled
  # lockup keeps its own light/dark, just without colour.
  program_tone: gray
  height: 64
  wall_height: 44
  max_width: 220
  tier: community

