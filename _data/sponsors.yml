- name: High Country Automotive
  url: https://highcountryauto.net/
  # A full-colour illustrated badge (two rigs against snow-capped peaks over a
  # wrench banner), not a flat wordmark. It can't be flattened to one value like
  # the transparent marks — dk would swallow the whole illustration in a black
  # silhouette — so it takes rev: grayscale desaturates the badge to sit level on
  # the wall while every shape survives, and hover blooms it back to full colour.
  # The white keyline halo keeps it legible on the cream plate at grayscale.
  logo: /assets/images/sponsors/high-country-automotive.png
  note: Summit County — auto repair
  tone: rev
  # On the program's dark plate rev would invert this illustrated badge into a
  # photo negative, so it desaturates only (program_tone: gray) — every shape and
  # its own light/dark survives, just without colour.
  program_tone: gray
  # At 2.05:1 this is a wide badge; 60px is ~123px wide, and max_width lets the
  # detailed lockup run out enough for the tagline to stay readable.
  height: 60
  wall_height: 42
  max_width: 200
  tier: supporting

