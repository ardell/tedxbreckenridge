# TEDxBreckenridge sponsors — the single source of truth.
#
# Consumed by:
#   _includes/facets/sponsor-wall.html  (the pre-footer logo marquee on every page)
#   website/pages/sponsors.md           (the full Our Sponsors recognition page)
#
# Fields:
#   name  — organization name; used as logo alt text and the card title
#   url   — organization website. Optional; a sponsor without one renders as a
#           plain (non-linked) logo plate.
#   logo  — logo image, as a site-relative path under /assets/. Keep these in
#           the repo rather than hotlinking a sponsor's own CDN: remote copies
#           get renamed or removed without warning, and they leak our visitors'
#           IPs to a third party.
#   wall_logo — optional wider lockup used only in the pre-footer marquee,
#           where a tall stacked mark would set its type too small to read.
#           Defaults to logo.
#   note  — short descriptor shown under the name on the Sponsors page only
#   tone  — how to neutralize the logo's native value so the wall reads as one
#           family before hover blooms it back to full colour:
#             dk    — dark or mid-value marks on transparency; flattened to black
#             mu    — logos baked onto an opaque (usually white) plate; multiplied
#             inv   — white marks on transparency; inverted to read on light
#             rev   — lockups reversed out of a filled colour plate; desaturated
#                     rather than flattened, so the knocked-out mark survives
#             as-is — left untouched, for brands whose standards forbid
#                     recolouring the mark
#   height      — rendered logo height in px on the Sponsors page card
#   wall_height — rendered logo height in px in the pre-footer marquee
#   max_width   — optional cap in px for logos that are very wide for their height
#   tier  — premier | anchor | community | corporate
#
# Order within a tier is the display order. Keep tiers grouped together.

- name: Imperial Hotel & Private Residences™
  url: https://imperialbreckenridge.com/
  # Their brand standards forbid altered or recoloured versions of the mark, so
  # both files render as-is in PMS 2363 rather than taking a neutralizing tone.
  #
  # Their primary (vertical) lockup on the card, from the supplied IMP-Logo-T.ai.
  # The guide reserves the horizontal secondary lockup for exactly our marquee
  # case — "when vertical space is limited" — because the stacked version sets
  # "& PRIVATE RESIDENCES" too small to read in a 34px strip.
  logo: /assets/images/sponsors/imperial-hotel-private-residences.svg
  wall_logo: /assets/images/sponsors/imperial-hotel-private-residences-horizontal.svg
  note: Mountain luxury on the private side of Peak 8 — where Breckenridge's legacy and landscape meet.
  tone: as-is
  height: 150
  wall_height: 34
  tier: premier

